services:
  database:
    image: paradedb/paradedb:0.26.4-pg17
    restart: unless-stopped
    volumes:
      - database:/var/lib/postgresql/data
    env_file:
      - backend/.env
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - django-liberty
  backend:
    restart: unless-stopped
    build:
      context: backend
    expose:
      - "8000"
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    env_file:
      - backend/.env
    environment:
      DEBUG: "false"
      POSTGRES_HOST: database
      POSTGRES_PORT: "5432"
    healthcheck:
      test: [
          "CMD",
          "python",
          "-c",
          "import urllib.request;
          urllib.request.urlopen('http://localhost:8000/health/')",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      database:
        condition: service_healthy
    networks:
      - django-liberty
  frontend:
    restart: unless-stopped
    build:
      context: frontend
    expose:
      - "3000"
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      NUXT_DJANGO_API_URL: http://backend:8000/api
      NUXT_HOST: 0.0.0.0
      NUXT_PORT: 3000
    healthcheck:
      test: [
          "CMD",
          "bun",
          "--eval",
          "fetch('http://127.0.0.1:3000/').then((response) => { if
          (!response.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - django-liberty

networks:
  django-liberty:
    driver: bridge

volumes:
  database:
